<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf6ee" />
    <link rel="icon" href="data:," />
    <title>spotrank</title>
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div class="brand">
          <span class="logo" data-art="scale"></span>
          <div>
            <h1>spotrank</h1>
            <p>Find which of your tracks deserve Meta ads budget. Everything stays in your browser.</p>
          </div>
        </div>
        <div class="vine" data-art="vine"></div>
      </header>

      <main>
        <label id="drop" class="drop">
          <input id="file" class="visually-hidden" type="file" accept=".csv,text/csv" />
          <span class="drop-art" data-art="niche"></span>
          <strong id="drop-title">Drop your Spotify for Artists CSV</strong>
          <span id="drop-hint">or click to choose a file · needs song, listeners, streams, saves</span>
        </label>

        <section id="results" hidden>
          <div class="toolbar">
            <p id="summary" class="summary"></p>
            <div class="controls">
              <label class="field" title="Below this, a track is a low-confidence sample and its score is penalized">
                <span>Min listeners</span>
                <input id="min-listeners" type="number" min="0" step="100" value="500" />
              </label>
              <label class="field" title="Tracks need this many listeners to be scale or reach">
                <span>Proven audience</span>
                <input id="proven" type="number" min="0" step="500" value="2000" />
              </label>
              <button id="download" class="button" type="button">Download ranked CSV</button>
            </div>
          </div>

          <details id="mapping" class="mapping">
            <summary>Column mapping</summary>
            <div id="mapping-grid" class="mapping-grid"></div>
          </details>

          <div id="error" class="error" hidden></div>

          <div id="output">
            <section id="picks" class="picks" hidden>
              <h2 id="picks-title"></h2>
              <p id="picks-note" class="lede"></p>
              <div id="picks-grid" class="picks-grid"></div>
            </section>

            <section class="ranking">
              <h2>Full ranking</h2>
              <nav id="tabs" class="tabs" aria-label="Filter by category"></nav>
              <p id="tab-note" class="lede"></p>
              <div class="table-wrap"><table id="table"></table></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div id="overlay" class="overlay" hidden>
      <div><span class="overlay-art" data-art="niche"></span>Drop to rank</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
